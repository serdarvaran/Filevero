name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v1.0.0
        required: true
permissions:
  contents: read
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  # The tag reaches shell commands only through this variable and is checked against the app version first.
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.x'
      - name: Check the tag matches the app version
        shell: pwsh
        run: |
          [xml]$props = Get-Content windows/Directory.Build.props
          $version = $props.Project.PropertyGroup.Version
          if ($env:TAG -cne "v$version") { throw "Tag $env:TAG does not match app version $version" }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Publish Windows x64
        shell: pwsh
        run: |
          dotnet restore windows/Filevero.Windows --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish windows/Filevero.Windows -c Release --no-restore -o build/windows/Filevero
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # The full desktop and media suites run on every push to main; a release still rechecks the engines.
      - name: Engine safety checks
        shell: pwsh
        run: |
          dotnet run --project windows/Filevero.Verify -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package portable app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $archive = "dist/Filevero-Windows-x64-$env:VERSION.zip"
          Compress-Archive -Path build/windows/Filevero/* -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $archive -Leaf)" | Out-File -FilePath "$archive.sha256" -Encoding ascii -NoNewline
          Write-Host "SHA-256 $hash"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: windows-release
          path: dist
          retention-days: 3
          if-no-files-found: error

  macos:
    # Xcode 26 builds the Liquid Glass interface; older SDKs fall back to plain materials.
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - name: Use the newest installed Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: Check the tag matches the app version
        run: |
          version=$(plutil -extract CFBundleShortVersionString raw Resources/Info.plist)
          if [[ "$TAG" != "v$version" ]]; then echo "Tag $TAG does not match app version $version" >&2; exit 1; fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      # Without a Developer ID certificate the app is ad-hoc signed and not notarized; the release notes explain
      # the one-time approval. FFmpeg, yt-dlp and LibreOffice are installed by the app on first launch. The public
      # update configuration points Sparkle at this repository's latest appcast.xml.
      - name: Build ad-hoc signed app
        env:
          FILEVERO_UPDATE_CONFIG: Configuration/Updates.public.plist
        run: |
          scripts/setup-exiftool.sh
          FILEVERO_EXTERNAL_TOOLS=1 FILEVERO_SIGNING_MODE=ad-hoc scripts/build-app.sh release
          codesign --verify --deep --strict build/Filevero.app
      # Users have no .build folder; SwiftPM's resource lookup on some toolchains silently depends on it.
      - name: Launch the packaged app without the build folder
        timeout-minutes: 5
        run: |
          mv .build "$RUNNER_TEMP/swiftpm-build"
          trap 'mv "$RUNNER_TEMP/swiftpm-build" .build' EXIT
          scripts/check-packaged-launch.sh build/Filevero.app
      # A disk image whose window shows where to drag the app; Filevero also offers the move itself when it runs
      # from Downloads or the disk image.
      - name: Package disk image
        run: |
          mkdir -p dist
          image="dist/Filevero-macOS-arm64-$VERSION.dmg"
          scripts/build-dmg.sh build/Filevero.app "$image"
          (cd dist && shasum -a 256 "$(basename "$image")" > "$(basename "$image").sha256")
          cat "$image.sha256"
      # Sparkle downloads this ZIP, checks its Ed25519 signature against the key in Info.plist, installs it in place
      # and relaunches Filevero. The publish job checks that the secret matches that key before anything is uploaded.
      - name: Sign the update feed
        env:
          FILEVERO_UPDATE_ED_KEY: ${{ secrets.FILEVERO_UPDATE_ED_KEY }}
        run: |
          if [[ -z "$FILEVERO_UPDATE_ED_KEY" ]]; then echo "Add the FILEVERO_UPDATE_ED_KEY repository secret (generate_keys -x)." >&2; exit 1; fi
          sparkle=.build/artifacts/sparkle/Sparkle/bin
          feed=$(mktemp -d)
          archive="Filevero-macOS-arm64-$VERSION.zip"
          python3 scripts/archive-app.py build/Filevero.app "$feed/$archive"
          printf '%s' "$FILEVERO_UPDATE_ED_KEY" | "$sparkle/generate_appcast" --ed-key-file - \
            --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/" \
            --link "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" "$feed"
          printf '%s' "$FILEVERO_UPDATE_ED_KEY" | "$sparkle/sign_update" --verify --ed-key-file - "$feed/appcast.xml"
          python3 scripts/validate-update-feed.py "$feed/appcast.xml" "$(plutil -extract CFBundleVersion raw -o - build/Filevero.app/Contents/Info.plist)"
          cp "$feed/$archive" "$feed/appcast.xml" dist/
          (cd dist && shasum -a 256 "$archive" > "$archive.sha256")
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: macos-release
          path: dist
          retention-days: 3
          if-no-files-found: error

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - name: Collect packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name windows-release --dir dist
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name macos-release --dir dist
          (cd dist && sha256sum --check ./*.sha256)
      # Installed Windows copies read windows-update.json from the latest release and verify the ZIP's Ed25519 signature.
      - name: Sign the Windows update manifest
        env:
          FILEVERO_UPDATE_ED_KEY: ${{ secrets.FILEVERO_UPDATE_ED_KEY }}
        run: |
          version="${TAG#v}"
          archive="Filevero-Windows-x64-$version.zip"
          python3 scripts/sign-windows-update.py "dist/$archive" "$version" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$archive" dist/windows-update.json
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          cat > notes.md <<EOF
          ## Filevero $version

          ### Windows (x64, Windows 10 or later)
          Download \`Filevero-Windows-x64-$version.zip\`, extract it into its own folder and run \`Filevero.exe\`. The .NET runtime is included. The app is not Authenticode signed yet, so Windows SmartScreen may ask you to confirm the first launch: choose **More info → Run anyway**. Later versions install themselves from inside the app and restart it.

          ### macOS (Apple Silicon, macOS 13 or later)
          Download \`Filevero-macOS-arm64-$version.dmg\`, open it and drag **Filevero** onto the **Applications** folder in the window that appears. Then eject the disk image and open Filevero from Applications. If you open Filevero from the disk image or Downloads instead, it offers to move itself to Applications, which Finder services and opening at login need.

          This Mac build is **not notarized by Apple yet**, so macOS blocks the first launch with a warning. To open it once:
          1. Open Filevero from Applications and close the warning.
          2. Go to **System Settings → Privacy & Security**, scroll down and choose **Open Anyway** next to Filevero, then confirm.

          Alternatively, run \`xattr -dr com.apple.quarantine /Applications/Filevero.app\` in Terminal. Only do this for a download whose SHA-256 matches the \`.sha256\` file. From 1.0.3 on, Filevero updates itself from this page: when a new version is published, **Check for Updates…** downloads it, verifies its signature, installs it and restarts the app. Earlier versions need this download once. On first launch, Filevero offers to download FFmpeg, yt-dlp and LibreOffice from their official sources.

          ### Türkçe
          **Windows:** \`Filevero-Windows-x64-$version.zip\` dosyasını indir, ayrı bir klasöre çıkar ve \`Filevero.exe\`'yi çalıştır. Uygulama henüz Authenticode ile imzalı değil; SmartScreen sorarsa **Ek bilgi → Yine de çalıştır**'ı seç. Sonraki sürümler uygulamanın içinden kurulur ve uygulamayı yeniden başlatır.

          **macOS (Apple Silicon, macOS 13+):** \`Filevero-macOS-arm64-$version.dmg\` dosyasını aç ve açılan pencerede **Filevero**'yu **Uygulamalar** klasörünün üzerine sürükle. Ardından disk görüntüsünü çıkar ve Filevero'yu Uygulamalar'dan aç. Filevero disk görüntüsünden ya da İndirilenler'den açılırsa kendini Uygulamalar'a taşımayı önerir; Finder servisleri ve girişte açılma bunu gerektirir. Bu Mac sürümü henüz Apple tarafından notarize edilmedi; ilk açılışta macOS uyarı verir. Uygulamayı bir kez açıp uyarıyı kapat, sonra **Sistem Ayarları → Gizlilik ve Güvenlik** bölümünde Filevero'nun yanındaki **Yine de Aç**'ı seç. İndirmenin SHA-256 özeti \`.sha256\` dosyasıyla eşleşmeli. 1.0.3'ten itibaren Filevero kendini bu sayfadan günceller: yeni sürüm yayımlandığında **Güncellemeleri Denetle…** sürümü indirir, imzasını doğrular, kurar ve uygulamayı yeniden başlatır. Daha eski sürümlerde bu indirmeyi bir kez elle yapman gerekir.
          EOF
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "Filevero $version" --notes-file notes.md --verify-tag
          fi
